name: Build Android and iOS

on: push

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup caching
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            */*/node_modules
          key: cache-${{ runner.OS }}-${{ hashFiles('**/*.lock') }}
          restore-keys: |
            cache-${{ runner.OS }}-
      - name: Install dependencies
        run: |
          yarn
      - name: Run tests
        run: |
          yarn workspace @thu-info/app lint
          yarn workspace @thu-info/app test
  build-android:
    needs: install-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "corretto"
          java-version: "17"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup caching
        if: startsWith(github.ref, 'refs/tags') == false
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            */*/node_modules
          key: cache-${{ runner.OS }}-${{ hashFiles('**/*.lock') }}
          restore-keys: |
            cache-${{ runner.OS }}-
      - name: Install dependencies
        run: |
          yarn
      - name: Prepare for building
        env:
          SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
        run: |
          openssl aes-256-cbc -k "$SECRET_PASSWORD" -in apps/thu-info-app/android/app/THUInfo.jks.enc -out apps/thu-info-app/android/app/THUInfo.jks -d
          sed -i "/preventRoot/d" apps/thu-info-app/android/app/src/main/java/com/unidy2002/thuinfo/MainApplication.kt
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: apps/thu-info-app/android
      - name: Build android release
        working-directory: apps/thu-info-app/android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SIGNATURE_DIGEST: ${{ secrets.SIGNATURE_DIGEST }}
        run: |
          architectures="arm64-v8a,x86_64"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            architectures="armeabi-v7a,arm64-v8a,x86,x86_64"
          fi
          ./gradlew assembleRelease "-PreactNativeArchitectures=$architectures"
      - name: Prepare artifact for attestation
        id: prepare_artifact
        run: |
          artifact_path=apps/thu-info-app/android/app/build/outputs/apk/release/app-release.apk
          test -s "$artifact_path"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            release_path="THUInfo_release_${GITHUB_REF_NAME}.apk"
            cp "$artifact_path" "$release_path"
            artifact_path="$release_path"
          fi
          echo "path=$artifact_path" >> "$GITHUB_OUTPUT"
      - name: Attest Android APK
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.prepare_artifact.outputs.path }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: apps/thu-info-app/android/app/build/outputs/apk/release/app-release.apk
      - name: Check release immutability
        id: release_status
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          encoded_tag=$(jq -rn --arg tag "$GITHUB_REF_NAME" '$tag | @uri')
          response_file=$(mktemp)
          status=$(curl --silent --show-error --max-time 60 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --output "$response_file" --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$encoded_tag")
          case "$status" in
            200) immutable=$(jq -r '.immutable == true and .draft == false' "$response_file") ;;
            404) immutable=false ;; # Drafts are handled by the release action.
            *) echo "::error::Could not check release immutability (HTTP $status)"; exit 1 ;;
          esac
          echo "immutable=$immutable" >> "$GITHUB_OUTPUT"
          if [ "$immutable" = true ]; then
            echo 'Release publication skipped: this tag already has an immutable release. Newly built CI artifacts are attested, but published assets remain unchanged. Use a new version tag to publish changed binaries.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create Release
        if: github.ref_type == 'tag' && steps.release_status.outputs.immutable == 'false'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ./release-notes.md
          fail_on_unmatched_files: true
          files: ${{ steps.prepare_artifact.outputs.path }}
      - name: Publish Release
        if: github.ref_type == 'tag' && steps.release_status.outputs.immutable == 'false'
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'legacy' }}
  build-ios:
    needs: install-and-test
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup Ruby
        id: setup-ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.7"
          bundler: "2.6.2"
          bundler-cache: true
      - name: Export Ruby path
        run: echo "PATH=${{ steps.setup-ruby.outputs.ruby-prefix }}/bin:$PATH" >> "$GITHUB_ENV"
      - name: Setup caching
        if: startsWith(github.ref, 'refs/tags') == false
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            */*/node_modules
            apps/thu-info-app/ios/Pods
          key: cache-${{ runner.OS }}-${{ hashFiles('**/*.lock') }}
          restore-keys: |
            cache-${{ runner.OS }}-
      - name: Setup ccache
        if: startsWith(github.ref, 'refs/tags') == false
        uses: hendrikmuhs/ccache-action@main
      - name: Install dependencies
        run: |
          yarn
          cd apps/thu-info-app/ios && bundle exec pod update hermes-engine React-Core-prebuilt ReactNativeDependencies && bundle exec pod install && cd ../../..
      - name: Commit lockfile changes
        if: endsWith(github.ref, 'master') == true
        continue-on-error: true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Gemfile.lock apps/thu-info-app/ios/Podfile.lock
          git commit -m "chore: lockfile maintenance"
      - name: Push lockfile changes
        if: endsWith(github.ref, 'master') == true
        uses: ad-m/github-push-action@master
        with:
          branch: ${{ github.ref }}
        continue-on-error: true
      - name: SSH setting up
        run: |
          echo "${{ secrets.CERTIFICATE_REPO_PRIVATE_KEY }}" | tr -d "\r" | ssh-add - > /dev/null
      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Update beta
        run: cd apps/thu-info-app/ios && bundle exec fastlane beta
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_PRIVATE_KEY_ID: ${{ secrets.APPSTORE_API_PRIVATE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          CCACHE_SLOPPINESS: "clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros"
          CCACHE_FILECLONE: "true"
          CCACHE_DEPEND: "true"
          CCACHE_INODECACHE: "true"
      - name: Check iOS artifact
        run: test -s apps/thu-info-app/ios/thu_info.ipa
      - name: Attest iOS IPA
        uses: actions/attest@v4
        with:
          subject-path: apps/thu-info-app/ios/thu_info.ipa
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: apps/thu-info-app/ios/thu_info.ipa
  build-harmony:
    needs: install-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    # Publish the API 26 image in the organization fork before running this job.
    container:
      image: ${{ vars.HARMONY_CI_IMAGE || 'ghcr.io/thu-info-community/harmonyos-pipeline-docker/harmonyos-ci-image:26.0.0.851' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      HARMONY_TOOLS_HOME: /opt/harmonyos-tools/command-line-tools
      DEVECO_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk
      OHOS_BASE_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk/default/openharmony
    steps:
      - uses: actions/checkout@v7
      - name: Setup caching
        if: startsWith(github.ref, 'refs/tags') == false
        uses: actions/cache@v6
        with:
          path: |
            apps/thu-info-app/node_modules
          key: cache-harmony-${{ hashFiles('**/*.lock') }}
          restore-keys: |
            cache-harmony-
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify Harmony toolchain
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.HARMONY_TOOLS_HOME;
          for (const variant of ['openharmony', 'hms']) {
            for (const component of ['ets', 'js', 'native', 'toolchains']) {
              const file = variant === 'openharmony' ? 'oh-uni-package.json' : 'uni-package.json';
              const meta = JSON.parse(fs.readFileSync(path.join(root, 'sdk/default', variant, component, file), 'utf8'));
              if (Number(meta.apiVersion) !== 26 || meta.platformVersion !== '26.0.0' || meta.releaseType !== 'Release') {
                throw new Error(`Expected release API 26 SDK: ${variant}/${component}`);
              }
            }
          }
          for (const pkg of ['hvigor', 'hvigor-ohos-plugin']) {
            const meta = JSON.parse(fs.readFileSync(path.join(root, 'hvigor', pkg, 'package.json'), 'utf8'));
            if (meta.version !== '6.26.8') throw new Error(`Expected ${pkg} 6.26.8, received ${meta.version}`);
          }
          NODE
          echo "${HARMONY_TOOLS_HOME}/bin" >> "$GITHUB_PATH"
          node_path="$(readlink -f "$(command -v node)")"
          node_home="$(dirname "$(dirname "$node_path")")"
          echo "DEVECO_NODE_HOME=${node_home}" >> "$GITHUB_ENV"
          echo "NODE_HOME=${node_home}" >> "$GITHUB_ENV"
      - name: Setup Harmony npm registry
        run: |
          echo "@ohos:registry=https://repo.harmonyos.com/npm/" >> "$HOME/.npmrc"
          echo "@ohos:registry=https://repo.harmonyos.com/npm/" >> .npmrc
      - name: Install dependencies
        run: |
          git config --global --add safe.directory $(pwd)
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          npm install -g yarn@1.22.22
          ./setup-harmony.sh
      - name: Bundle project
        working-directory: apps/thu-info-app
        run: |
          yarn codegen-harmony
          yarn bundle-harmony
      - name: Prepare signing materials
        working-directory: apps/thu-info-app/harmony
        env:
          OH_CERT: ${{ secrets.OH_CERT }}
          OH_PROFILE: ${{ secrets.OH_PROFILE_B64 }}
          OH_STORE_FILE: ${{ secrets.OH_STORE_FILE_B64 }}
          OH_SIGN_MATERIAL: ${{ secrets.OH_SIGN_MATERIAL_B64 }}
          OH_STORE_PASSWORD: ${{ secrets.OH_STORE_PASSWORD }}
          OH_KEY_ALIAS: ${{ secrets.OH_KEY_ALIAS }}
          OH_KEY_PASSWORD: ${{ secrets.OH_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-sign
          rm -rf .ci-sign/material /tmp/oh_sign_unpack
          if [ -n "${OH_SIGN_MATERIAL:-}" ]; then
            mkdir -p /tmp/oh_sign_unpack
            printf '%s' "${OH_SIGN_MATERIAL}" | base64 -d > /tmp/oh_sign_material.tar
            tar -xf /tmp/oh_sign_material.tar -C /tmp/oh_sign_unpack
            cp -a "$(find /tmp/oh_sign_unpack -type d -name material | head -n 1)" .ci-sign/material
          fi
          if [ -d .ci-sign/material ]; then
            find .ci-sign/material -name '._*' -type f -delete
            chmod -R a+rX,u+w .ci-sign/material
          fi
          cert_file="$(pwd)/.ci-sign/oh_cert.cer"
          printf '%s\n' "${OH_CERT}" > "${cert_file}"
          OH_CERT_PATH="${cert_file}"
          if [ -d .ci-sign/material ]; then
            if [ -z "${OH_STORE_FILE:-}" ]; then
              OH_STORE_FILE="$(find .ci-sign/material -type f \( -name '*.p12' -o -name '*.pfx' \) | head -n 1)"
            fi
            if [ -z "${OH_PROFILE:-}" ]; then
              OH_PROFILE="$(find .ci-sign/material -type f \( -name '*.p7b' -o -name '*.mobileprovision' -o -name '*.profile' \) | head -n 1)"
            fi
          fi
          resolve_to_file() {
            local raw="$1"
            local out="$2"
            if [ -f "${raw}" ]; then
              cp -f "${raw}" "${out}"
              return 0
            fi
            printf '%s' "${raw}" | base64 -d > "${out}"
            [ -s "${out}" ]
          }
          if [ -n "${OH_STORE_FILE:-}" ] && [ ! -f "${OH_STORE_FILE}" ]; then
            resolve_to_file "${OH_STORE_FILE}" "$(pwd)/.ci-sign/oh_store_file.p12"
            OH_STORE_FILE="$(pwd)/.ci-sign/oh_store_file.p12"
          fi
          if [ -n "${OH_PROFILE:-}" ] && [ ! -f "${OH_PROFILE}" ]; then
            resolve_to_file "${OH_PROFILE}" "$(pwd)/.ci-sign/oh_profile.p7b"
            OH_PROFILE="$(pwd)/.ci-sign/oh_profile.p7b"
          fi
          echo "OH_STORE_FILE=${OH_STORE_FILE:-}"
          echo "OH_PROFILE=${OH_PROFILE:-}"
          echo "OH_CERT_PATH=${OH_CERT_PATH:-}"
          echo "HAS_OH_SIGN_MATERIAL=$([ -n "${OH_SIGN_MATERIAL:-}" ] && echo 1 || echo 0)"
          OH_STORE_PASSWORD="$(printf '%s' "${OH_STORE_PASSWORD:-}" | tr -d '\r\n')"
          OH_KEY_PASSWORD="$(printf '%s' "${OH_KEY_PASSWORD:-}" | tr -d '\r\n')"
          if [ -z "${OH_STORE_FILE:-}" ] || [ -z "${OH_PROFILE:-}" ] || [ -z "${OH_CERT_PATH:-}" ]; then
            echo "ERROR: Missing signing materials after resolution."
            exit 2
          fi
          cat > secrets.env <<EOF
          OH_STORE_PASSWORD=${OH_STORE_PASSWORD:-}
          OH_CERT_PATH=${OH_CERT_PATH:-}
          OH_KEY_ALIAS=${OH_KEY_ALIAS:-}
          OH_KEY_PASSWORD=${OH_KEY_PASSWORD:-}
          OH_PROFILE=${OH_PROFILE:-}
          OH_STORE_FILE=${OH_STORE_FILE:-}
          EOF
      - name: Build Harmony release
        working-directory: apps/thu-info-app/harmony
        shell: bash
        run: |
          set -euo pipefail
          "${HARMONY_TOOLS_HOME}/bin/hvigorw" assembleHap --mode module -p module=entry@default -p product=default -p buildMode=release --stacktrace --no-parallel --no-daemon
          "${HARMONY_TOOLS_HOME}/bin/hvigorw" assembleApp --mode project -p product=default -p buildMode=release --stacktrace --no-parallel --no-daemon
      - name: Check Harmony artifacts
        run: |
          test -s apps/thu-info-app/harmony/entry/build/default/outputs/default/entry-default-signed.hap
          test -s apps/thu-info-app/harmony/build/outputs/default/harmony-default-signed.app
      - name: Attest Harmony artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            apps/thu-info-app/harmony/entry/build/default/outputs/default/entry-default-signed.hap
            apps/thu-info-app/harmony/build/outputs/default/harmony-default-signed.app
      - name: Upload Harmony hap
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: apps/thu-info-app/harmony/entry/build/default/outputs/default/entry-default-signed.hap
      - name: Upload Harmony app
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: apps/thu-info-app/harmony/build/outputs/default/harmony-default-signed.app
